name: Python CI Pipeline

on:
  push:
    branches:
      - main
      - develop
      - mini-project-1.4-quality-gates
  pull_request:
    branches:
      - main
      - develop
      - mini-project-1.4-quality-gates
jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --only-binary=:all: -r requirements-lock.txt

      - name: Lint Python code
        run: python -m flake8 src tests

      - name: Run tests and enforce 80% coverage
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -v --cov=src --cov-report=term-missing --cov-report=html:htmlcov --cov-report=xml:coverage.xml --cov-fail-under=80
      - name: Build application
        run: python -m compileall src

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            htmlcov/
            coverage.xml
          if-no-files-found: warn